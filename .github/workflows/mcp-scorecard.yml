name: mcp-scorecard
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm test
      - run: npx -y mcp-scorecard@0.5.4 . --min-score 90
